name: Deploy Backend Services

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-migrate:
    name: Build, Test & Flyway Database Migration
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run Backend Unit Tests
        run: npm test

      - name: Build TypeScript Output & Bundles
        run: npm run build

      - name: Run Flyway PostgreSQL Database Migrations
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: flyway/flyway-action@v10
        with:
          url: "jdbc:postgresql://${{ secrets.DB_HOST }}:${{ secrets.DB_PORT || '5432' }}/${{ secrets.DB_NAME || 'librarian' }}"
          user: '${{ secrets.DB_USER }}'
          password: '${{ secrets.DB_PASSWORD }}'
          locations: 'filesystem:backend/migrations'
          command: 'migrate'

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: backend-dist
          path: backend/dist/
          retention-days: 7
