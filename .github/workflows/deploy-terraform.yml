name: Deploy Infrastructure & Backend (Terraform)

on:
  push:
    branches:
      - main
    paths:
      - 'terraform/**'
      - 'backend/**'
      - '.github/workflows/deploy-terraform.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'terraform/**'
      - 'backend/**'
      - '.github/workflows/deploy-terraform.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  deploy:
    name: Build Backend & Apply Terraform
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install & Build Backend Handlers
        run: |
          cd backend
          npm ci
          npm run build

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'eu-central-1' }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.0

      - name: Terraform Format Check
        run: |
          cd terraform
          terraform fmt -check

      - name: Terraform Init
        run: |
          cd terraform
          terraform init

      - name: Terraform Validate
        run: |
          cd terraform
          terraform validate -no-color

      - name: Terraform Plan
        id: plan
        run: |
          cd terraform
          terraform plan -no-color -input=false
        env:
          TF_VAR_environment: ${{ secrets.ENVIRONMENT || 'dev' }}

      - name: Terraform Apply
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: |
          cd terraform
          terraform apply -auto-approve -input=false
        env:
          TF_VAR_environment: ${{ secrets.ENVIRONMENT || 'dev' }}

