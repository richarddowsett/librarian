name: Deploy App (Expo Web S3/CloudFront & EAS Mobile)

on:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - '.github/workflows/deploy-app.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'app/**'
      - '.github/workflows/deploy-app.yml'
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  build-and-deploy-web:
    name: Build & Deploy Expo Web SPA to AWS S3 / CloudFront
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./app
    outputs:
      has_expo_token: ${{ steps.check-token.outputs.has_token }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Verification
        run: npm run typecheck

      - name: Export Web Application Bundle
        run: npx expo export --platform web
        env:
          EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL }}

      - name: Configure AWS Credentials
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'eu-central-1' }}

      - name: Sync Web Bundle to S3 Bucket
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          S3_BUCKET_NAME: ${{ secrets.S3_FRONTEND_BUCKET || 'shelfd-frontend-bucket' }}
        run: |
          aws s3 sync dist "s3://$S3_BUCKET_NAME" --delete

      - name: Clear CloudFront CDN Cache
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          DISTRIBUTION_ID_SECRET: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
          S3_BUCKET_NAME: ${{ secrets.S3_FRONTEND_BUCKET || 'shelfd-frontend-bucket' }}
        run: |
          DIST_ID="$DISTRIBUTION_ID_SECRET"
          if [ -z "$DIST_ID" ] || [ "$DIST_ID" == "None" ] || [ "$DIST_ID" == "null" ]; then
            echo "Searching for CloudFront Distribution ID by comment..."
            DIST_ID=$(aws cloudfront list-distributions --query "DistributionList.Items[?Comment=='CloudFront Distribution for Shelfd Frontend SPA'].Id | [0]" --output text)
          fi

          if [ -z "$DIST_ID" ] || [ "$DIST_ID" == "None" ] || [ "$DIST_ID" == "null" ]; then
            echo "Searching for CloudFront Distribution ID by S3 bucket origin..."
            DIST_ID=$(aws cloudfront list-distributions --query "DistributionList.Items[?Origins.Items[?contains(DomainName, '$S3_BUCKET_NAME')]].Id | [0]" --output text)
          fi

          if [ -n "$DIST_ID" ] && [ "$DIST_ID" != "None" ] && [ "$DIST_ID" != "null" ]; then
            echo "Invalidating CloudFront CDN Cache for Distribution ID: $DIST_ID..."
            INVALIDATION_ID=$(aws cloudfront create-invalidation --distribution-id "$DIST_ID" --paths "/*" --query "Invalidation.Id" --output text)
            echo "Successfully submitted CloudFront cache invalidation request: $INVALIDATION_ID for distribution $DIST_ID"
          else
            echo "::warning::CloudFront Distribution ID could not be found. Skipping cache invalidation."
          fi

      - name: Check Expo Token Presence
        id: check-token
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -n "$EXPO_TOKEN" ]; then
            echo "has_token=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_token=false" >> "$GITHUB_OUTPUT"
          fi

  eas-mobile-build:
    name: EAS Mobile Build (Trigger Manual or Tag)
    needs: build-and-deploy-web
    if: github.event_name == 'workflow_dispatch' && needs.build-and-deploy-web.outputs.has_expo_token == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./app

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install Dependencies
        run: npm ci

      - name: Build Mobile Apps via EAS
        run: npx eas-cli build --platform all --non-interactive
